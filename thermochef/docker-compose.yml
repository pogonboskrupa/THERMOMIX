version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - COOKIDOO_CLIENT_ID=${COOKIDOO_CLIENT_ID:-C01M001-ANDROID-APP-ANDROID}
      - ENV=production
      - PORT=8000
    volumes:
      - thermochef_data:/app/data
      - thermochef_config:/root/.thermochef
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  thermochef_data:
  thermochef_config:
